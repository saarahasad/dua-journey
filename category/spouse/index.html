econcile our hearts\",\"startTime\":0,\"endTime\":6},{\"arabic\":\"وَأَصْلِحْ ذَاتَ بَيْنِنَا\",\"transliteration\":\"Wa aslih dhata baynina\",\"meaning\":\"And mend what is between us\",\"startTime\":6,\"endTime\":10},{\"arabic\":\"وَاهْدِنَا سُبُلَ السَّلَامِ\",\"transliteration\":\"Wahdina subul as-salam\",\"meaning\":\"Guide us to the paths of peace\",\"startTime\":10,\"endTime\":14},{\"arabic\":\"وَنَجِّنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ\",\"transliteration\":\"Wa najjina minaz-zulumati ila an-nur\",\"meaning\":\"Save us from darkness into light\",\"startTime\":14,\"endTime\":20},{\"arabic\":\"وَجَنِّبْنَا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ\",\"transliteration\":\"Wa jannibna al-fawahisha ma zahara minha wa ma batan\",\"meaning\":\"Keep us away from immorality outward and inward\",\"startTime\":20,\"endTime\":28},{\"arabic\":\"وَبَارِكْ لَنَا فِي أَسْمَاعِنَا وَأَبْصَارِنَا وَقُلُوبِنَا وَأَزْوَاجِنَا وَذُرِّيَّاتِنَا\",\"transliteration\":\"Wa barik lana fi asma'ina wa absarina wa qulubina wa azwajina wa dhurriyyatina\",\"meaning\":\"Bless our hearing, our sight, our hearts, our spouses, and our children\",\"startTime\":28,\"endTime\":37},{\"arabic\":\"وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ\",\"transliteration\":\"Wa tub 'alayna innaka Anta at-Tawwab ar-Rahim\",\"meaning\":\"Accept our repentance; You are the Most Accepting, Most Merciful\",\"startTime\":37,\"endTime\":46},{\"arabic\":\"وَاجْعَلْنَا شَاكِرِينَ لِنِعْمَتِكَ مُثْنِينَ بِهَا قَابِلِيهَا وَأَتِمَّهَا عَلَيْنَا\",\"transliteration\":\"Waj'alna shakireena li ni'matika muthneena biha qabiliha wa atimaha 'alayna\",\"meaning\":\"Make us grateful for Your blessings, praising them, accepting them, and complete them upon us\",\"startTime\":46,\"endTime\":56}],\"questions\":[{\"question\":\"What is the first thing this dua asks Allah to reconcile?\",\"answer\":\"Our hearts.\",\"explanation\":\"True marital peace begins with aligned hearts.\"},{\"question\":\"What does 'Subul as-
