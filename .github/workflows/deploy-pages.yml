name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "new-design"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set base path
        id: base
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "BASE_PATH=/$REPO_LOWER" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BASE_PATH=/$REPO_LOWER" >> $GITHUB_ENV
          echo "Using BASE_PATH=/$REPO_LOWER"

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify output
        run: |
          echo "Build output (basePath folder):"
          ls -la out/
          ls -la out/*/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
